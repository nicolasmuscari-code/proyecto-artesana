<style>

    /* Define el tamaño y comportamiento de las imágenes de los productos */
    .card-img-top {
        height: 250px;
        object-fit: contain;
        cursor: zoom-in;
        transition: transform 0.3s ease;
    }

    /* Amplía suavemente la imagen cuando el usuario pasa el mouse */
    .card-img-top:hover {
        transform: scale(1.05);
    }

    /* Estilos visuales de las tarjetas de productos */
    .card {
        height: 100%;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
        border-radius: 10px;
        overflow: hidden;
    }

    /* Mantiene la barra de navegación visible al desplazarse por la página */
    .navbar-artesana {
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    /* Efecto visual para los enlaces del navbar */
    .navbar-artesana .nav-link {
        transition: transform 0.2s ease, color 0.2s ease;
    }

    /* El enlace se eleva levemente al pasar el mouse */
    .navbar-artesana .nav-link:hover {
        transform: translateY(-2px);
    }

    /* Efecto visual para los botones al pasar el mouse */
    .btn-primary {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    /* El botón se eleva levemente cuando el usuario pasa el mouse */
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

        /* Color del icono de WhatsApp */
    .icon-whatsapp {
    color: #25D366;
    }

    /* Color del icono de Instagram */
    .icon-instagram {
   color: #E4405F;
    }
</style>
